<!--
  Shoreline Web Design mark. Drawn by Bryan in Figma, cleaned here.

  Three changes from the Figma export:

  1. viewBox tightened from the exported 174x212 to the artwork's real bounds
     (x 7.6-162.3, y 32.4-186.6 = 154.7 x 154.2) and squared to 154.7. The export
     carried uneven padding, which would have left the mark off-centre and
     undersized inside every favicon tile generated from it.
  2. The arc was pure #000000. Everything else on this site is the inkNavy token
     #1b2a38; black read as harsh beside the real headings.
  3. Colours are literal here on purpose. This file is the SOURCE used to
     generate favicons, the og:image and anything rasterised, so it must render
     identically without a stylesheet. The header uses the INLINE version in
     components/logo-mark.html instead, which swaps these for currentColor and a
     custom property so it can adapt to dark mode.

  The wave blue #2E4865 is Bryan's choice from the logo design, kept as drawn.
  It is deeper than the site's pugetBlue token #366375; both now exist as tokens.
-->

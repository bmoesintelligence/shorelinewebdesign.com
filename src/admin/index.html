<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <title>Content Manager</title>
</head>

<body>
    <!-- Pinned deliberately, not on a range. 3.8.3 is the FLOOR for DecapBridge's
         PKCE auth flow, which this site uses - the kit shipped 3.0.0, which
         fails at login with no useful error. Don't drop below 3.8.3. -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script type="text/babel">
        // Mirrors the real post layout in _includes/layouts/post.html:
        // date over title, description, optional cover, then the body. The
        // author byline the kit rendered here was removed to match - every
        // post on this site is by the same person.
        const BlogPreview = createClass({
            render: function () {
                // Get all the props from the collection
                const data = this.props.entry.get("data").toJS();
                const { title, description, date: rawDate, image, imageAlt } = data;
                const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
                let formattedDate = "";
                if (date) {
                    formattedDate = Intl.DateTimeFormat("en-US", {
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }).format(date);
                }

                // The featured image is optional, so only resolve and render it
                // when one has actually been chosen
                const cover = image ? this.props.getAsset(image) : null;

                // Create elements for the preview pane in JSX, to be processed by Babel
                return (
                    <div className="blog">
                        <span className="date">{formattedDate}</span>
                        <h1 className="title">{title}</h1>
                        {description && <p className="description">{description}</p>}

                        {cover && <img src={cover.toString()} className="cover" alt={imageAlt || ""} />}

                        <hr className="divider" />

                        <div className="markdown">
                            {this.props.widgetFor("body")}
                        </div>
                    </div>
                );
            }
        });

        // Register the elements and styles for the "blog" collection
        CMS.registerPreviewTemplate("blog", BlogPreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");
    </script>
</body>

</html>
